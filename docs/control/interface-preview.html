<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BK8 — предварительный просмотр оформления</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="tasks.css"><link rel="stylesheet" href="interface.css">
<div class="app"><aside><div class="logo"><span>BK8 STAFF</span><strong>Панель управления</strong></div><nav>
<button class="nav-item active" data-view="overview">▦ Обзор</button><button class="nav-item" data-view="employees">♟ Сотрудники</button><button class="nav-item" data-view="schedule">◷ Расписание</button></nav><p>Пример оформления<br>Без доступа к рабочим данным</p></aside>
<main><header><strong>BK8 · Панель управления</strong><span>Предварительный просмотр</span></header><section class="content" id="preview"></section></main></div>
<script>
const root=document.getElementById('preview');
const views={
overview:()=>`<div class="page-head"><div><h1>Обзор ресторана</h1><p>Сотрудники, документы и задачи — самое важное на одном экране.</p></div><button class="secondary">Обновить</button></div><div class="stats">${[['Сотрудники','24','22 активны'],['Документы','2','требуют внимания'],['Задачи','3','в работе'],['Выдача','1','покупка ожидает']].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong><span class="trend">${x[2]}</span></div>`).join('')}</div><div class="grid"><article class="panel"><h3>Требует внимания</h3><div class="alert"><span class="alert-icon">▤</span><div><strong>Проверьте сроки документов</strong><small>Два документа скоро истекают</small></div><span class="badge">Документы</span></div></article><article class="panel"><h3>Быстрые действия</h3><div class="quick"><button data-view="employees">Открыть сотрудников →</button><button data-view="schedule">Открыть расписание →</button></div></article></div>`,
employees:()=>`<div class="page-head"><div><h1>Сотрудники</h1><p>Найдите сотрудника и откройте его карточку.</p></div><button class="primary compact">＋ Добавить сотрудника</button></div><article class="panel"><label>Поиск по имени<input placeholder="Введите фамилию"></label><div class="live-table-wrap"><table><thead><tr><th>Сотрудник</th><th>Статус</th><th>Действие</th></tr></thead><tbody><tr><td><strong>Пример сотрудника</strong><small>Член бригады ресторана</small></td><td><span class="status green">Активен</span></td><td><button class="secondary">Открыть карточку</button></td></tr></tbody></table></div></article>`,
schedule:()=>`<div class="page-head"><div><h1>Расписание</h1><p>Выберите неделю, измените смены и сохраните результат.</p></div><button class="primary compact">Сохранить изменения</button></div><article class="panel"><label>Неделя<input type="date" value="2026-10-19"></label><div class="live-table-wrap"><table><thead><tr><th>Сотрудник</th>${['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody><tr><td>Пример сотрудника</td>${Array.from({length:7},(_,i)=>`<td><input aria-label="Смена" value="${i<5?'09:00–18:00':'Выходной'}" style="min-width:125px"></td>`).join('')}</tr></tbody></table></div></article>`};
function render(view){root.innerHTML=views[view]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}
document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)render(b.dataset.view);});render('overview');
</script></html>
